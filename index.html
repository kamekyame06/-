<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測量士試験 問題集アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
        }

        .question-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .question-info {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .question-text {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #333;
            white-space: pre-wrap;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            line-height: 1.6;
        }

        .option:hover {
            background: #e8e8e8;
            transform: translateX(5px);
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* 穴埋め問題用のスタイル */
        .fill-in-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .blank-item {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
        }

        .blank-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .word-option {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            min-width: 60px;
            text-align: center;
        }

        .word-option:hover {
            background: #e8e8e8;
        }

        .word-option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .word-option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .word-option.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .word-option.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .blank-answer {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            min-height: 40px;
            display: flex;
            align-items: center;
            font-weight: bold;
        }

        .blank-answer.correct {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .blank-answer.incorrect {
            background: #ffebee;
            border-color: #f44336;
        }

        .explanation {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            line-height: 1.6;
            display: none;
            white-space: pre-wrap;
        }

        .explanation.show {
            display: block;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 20px;
            }
            
            .question-card {
                padding: 15px;
            }
            
            .stat-item {
                font-size: 12px;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 測量士試験 問題集</h1>
            <div class="stats">
                <div class="stat-item">問題数: <span id="totalQuestions">0</span></div>
                <div class="stat-item">正解数: <span id="correctCount">0</span></div>
                <div class="stat-item">解答数: <span id="answeredCount">0</span></div>
            </div>
        </div>

        <div class="question-card">
            <div class="question-info" id="questionInfo">読み込み中...</div>
            <div class="question-text" id="questionText"></div>
            <div id="answerArea"></div>
            <div class="explanation" id="explanation"></div>
        <div class="buttons">
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">次の問題</button>
			<button class="btn btn-secondary" id="skipBtn" onclick="skipQuestion()">スキップ</button>
			<button class="btn btn-secondary" onclick="resetQuiz()">リセット</button>
	</div>

        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestion = null;
        let stats = {
            total: 0,
            correct: 0,
            answered: 0
        };

        async function loadQuestions() {
            try {
                const response = await fetch('questions.json');
                questions = await response.json();
                stats.total = questions.questions.length;
                updateStats();
                showRandomQuestion();
            } catch (error) {
                document.getElementById('questionText').textContent = 'エラー: 問題データを読み込めませんでした。';
                console.error('Error loading questions:', error);
            }
        }

        function showRandomQuestion() {
            if (questions.questions.length === 0) {
                document.getElementById('questionText').textContent = '問題がありません。';
                return;
            }

            const randomIndex = Math.floor(Math.random() * questions.questions.length);
            currentQuestion = questions.questions[randomIndex];

            document.getElementById('questionInfo').textContent = 
                `${currentQuestion.year} ${currentQuestion.period} ${currentQuestion.number}`;
            document.getElementById('questionText').textContent = currentQuestion.question;
            document.getElementById('explanation').classList.remove('show');

            const answerArea = document.getElementById('answerArea');
            
            // 問題タイプに応じて表示を切り替え
            if (currentQuestion.type === 'fill_in') {
                answerArea.innerHTML = renderFillInQuestion();
            } else {
                answerArea.innerHTML = renderMultipleChoiceQuestion();
            }
        }

        function renderMultipleChoiceQuestion() {
            return `<div class="options">${currentQuestion.options.map((option, index) => 
                `<div class="option" onclick="selectAnswer(${index})">${index + 1}. ${option}</div>`
            ).join('')}</div>`;
        }

        function renderFillInQuestion() {
            currentQuestion.userAnswers = new Array(currentQuestion.blanks.length).fill(null);
            
            let html = '<div class="fill-in-container">';
            currentQuestion.blanks.forEach((blank, index) => {
                html += `
                    <div class="blank-item">
                        <div class="blank-label">[${blank}]</div>
                        <div class="word-bank">
                            ${currentQuestion.wordBank.map((word, wordIndex) => 
                                `<div class="word-option" onclick="selectWord(${index}, ${wordIndex}, '${word}')">${word}</div>`
                            ).join('')}
                        </div>
                        <div class="blank-answer" id="answer-${index}"></div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        function selectAnswer(index) {
            const options = document.querySelectorAll('.option');
            if (options[0].classList.contains('disabled')) return;

            options.forEach(opt => opt.classList.remove('selected'));
            options[index].classList.add('selected');

            // 正誤判定
            const isCorrect = index === currentQuestion.correctAnswer;
            
            options.forEach(opt => opt.classList.add('disabled'));
            options[index].classList.add(isCorrect ? 'correct' : 'incorrect');
            options[currentQuestion.correctAnswer].classList.add('correct');

            if (isCorrect) {
                stats.correct++;
            }
            stats.answered++;
            updateStats();

            // 解説表示
            document.getElementById('explanation').textContent = currentQuestion.explanation;
            document.getElementById('explanation').classList.add('show');
        }

        function selectWord(blankIndex, wordIndex, word) {
            const wordOptions = document.querySelectorAll(`.blank-item:nth-child(${blankIndex + 1}) .word-option`);
            if (wordOptions[0].classList.contains('disabled')) return;

            // 選択を更新
            wordOptions.forEach(opt => opt.classList.remove('selected'));
            wordOptions[wordIndex].classList.add('selected');
            
            currentQuestion.userAnswers[blankIndex] = word;
            document.getElementById(`answer-${blankIndex}`).textContent = word;

            // 全て選択されたか確認
            if (currentQuestion.userAnswers.every(ans => ans !== null)) {
                checkFillInAnswers();
            }
        }

        function checkFillInAnswers() {
            let allCorrect = true;
            
            currentQuestion.blanks.forEach((blank, index) => {
                const answerDiv = document.getElementById(`answer-${index}`);
                const wordOptions = document.querySelectorAll(`.blank-item:nth-child(${index + 1}) .word-option`);
                const isCorrect = currentQuestion.userAnswers[index] === currentQuestion.answers[index];
                
                answerDiv.classList.add(isCorrect ? 'correct' : 'incorrect');
                
                wordOptions.forEach(opt => {
                    opt.classList.add('disabled');
                    if (opt.textContent === currentQuestion.answers[index]) {
                        opt.classList.add('correct');
                    } else if (opt.classList.contains('selected')) {
                        opt.classList.add('incorrect');
                    }
                });
                
                if (!isCorrect) allCorrect = false;
            });

            if (allCorrect) {
                stats.correct++;
            }
            stats.answered++;
            updateStats();

            // 解説表示
            document.getElementById('explanation').textContent = currentQuestion.explanation;
            document.getElementById('explanation').classList.add('show');
        }

        function updateStats() {
            document.getElementById('totalQuestions').textContent = stats.total;
            document.getElementById('correctCount').textContent = stats.correct;
            document.getElementById('answeredCount').textContent = stats.answered;
        }

        function nextQuestion() {
            showRandomQuestion();
        }

        function skipQuestion() {
            showRandomQuestion();
